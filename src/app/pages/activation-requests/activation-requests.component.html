<app-page-breadcrumb pageTitle="Activation Requests" />
@if (userRole() === 'Super Admin') {
    <div class="space-y-6">
        <div>
            <app-basic-table-one 
                [isLoading]="isLoading()"
                [columns]="columns" 
                [tableData]="dataArr()" 
                [showSearch]="true" 
                [showActions]="true"
                [actions]="allActions"
                />
        </div>
    </div>
} @else if (userRole() === 'BDO') {
    <div class="space-y-6">
        <div>
            <app-basic-table-one 
                [isLoading]="isLoading()"
                [columns]="bdoColumns" 
                [tableData]="bdoDataArr()" 
                [showSearch]="true" 
            />
        </div>
    </div>
}
