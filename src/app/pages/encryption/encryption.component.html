<div class="min-h-screen bg-gray-50 p-6 dark:bg-gray-950">
  <div class="mx-auto max-w-6xl">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">
        Encryption / Decryption
      </h1>

      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Encrypt or decrypt data using AES-GCM.
      </p>
    </div>

    <!-- Main Card -->
    <div
      class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm
             dark:border-gray-800 dark:bg-gray-900"
    >

      <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

        <!-- Input -->
        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Input
          </label>

          <textarea
            [(ngModel)]="inputText"
            rows="16"
            placeholder="Enter JSON or encrypted text..."
            class="w-full resize-none rounded-xl border border-gray-300
                   bg-white p-4 text-sm text-gray-800 outline-none
                   transition
                   focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20
                   dark:border-gray-700 dark:bg-gray-950
                   dark:text-white dark:placeholder-gray-500"
          ></textarea>
        </div>

        <!-- Output -->
        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Output
          </label>

          <textarea
            [(ngModel)]="outputText"
            rows="16"
            readonly
            placeholder="Result will appear here..."
            class="w-full resize-none rounded-xl border border-gray-300
                   bg-gray-50 p-4 text-sm text-gray-800 outline-none
                   dark:border-gray-700 dark:bg-gray-950
                   dark:text-white dark:placeholder-gray-500"
          ></textarea>
        </div>

      </div>

      <!-- Buttons -->
      <div class="mt-6 flex flex-wrap justify-center gap-3">

        <button
          type="button"
          (click)="encryptText()"
          class="inline-flex items-center gap-2 rounded-lg
                 bg-brand-500 px-5 py-2.5 text-sm font-medium
                 text-white transition hover:bg-brand-600
                 focus:outline-none focus:ring-2
                 focus:ring-brand-500/30"
        >
          <i class="bi bi-lock-fill"></i>
          Encrypt
        </button>

        <button
          type="button"
          (click)="decryptText()"
          class="inline-flex items-center gap-2 rounded-lg
                 border border-gray-300 bg-white px-5 py-2.5
                 text-sm font-medium text-gray-700 transition
                 hover:bg-gray-50
                 focus:outline-none focus:ring-2
                 focus:ring-gray-300
                 dark:border-gray-700 dark:bg-gray-800
                 dark:text-gray-200 dark:hover:bg-gray-700"
        >
          <i class="bi bi-unlock-fill"></i>
          Decrypt
        </button>

        <button
          type="button"
          (click)="clear()"
          class="inline-flex items-center gap-2 rounded-lg
                 border border-gray-300 bg-white px-5 py-2.5
                 text-sm font-medium text-gray-700 transition
                 hover:bg-gray-50
                 dark:border-gray-700 dark:bg-gray-800
                 dark:text-gray-200 dark:hover:bg-gray-700"
        >
          <i class="bi bi-x-circle"></i>
          Clear
        </button>

      </div>

      <!-- Error -->
      @if (errorMessage) {
        <div
          class="mt-5 rounded-lg border border-error-200
                 bg-error-50 px-4 py-3 text-sm text-error-600
                 dark:border-error-500/20 dark:bg-error-500/10
                 dark:text-error-400"
        >
          {{ errorMessage }}
        </div>
      }

    </div>

  </div>
</div>
