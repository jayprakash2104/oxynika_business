<section class="referral-banner col-span-12">


  <!-- Animated gradient background -->
  <div class="referral-aurora" aria-hidden="true"></div>
  <div class="referral-glow referral-glow-one" aria-hidden="true"></div>
  <div class="referral-glow referral-glow-two" aria-hidden="true"></div>


  <!-- Decorative background artwork -->
  <div class="referral-artwork" aria-hidden="true">
    <!-- Upper-left overlapping curves -->
    <span class="art-shape shape-left-large"></span>
    <span class="art-shape shape-left-small"></span>
    <span class="art-shape shape-left-pale"></span>

    <!-- Upper-right blue curves -->
    <span class="art-shape shape-right-large"></span>
    <span class="art-shape shape-right-small"></span>

    <!-- Lower-left overlapping curves -->
    <span class="art-shape shape-bottom-left"></span>
    <span class="art-shape shape-bottom-left-small"></span>

    <!-- Lower-right overlapping curves -->
    <span class="art-shape shape-bottom-right"></span>
    <span class="art-shape shape-bottom-right-small"></span>

    <!-- Small decorative dots -->
    <span class="art-dot art-dot-left"></span>
    <span class="art-dot art-dot-right"></span>
  </div>

  <!-- Main content -->
  <div class="referral-banner-content">
    <div class="absolute top-0 right-0">
      <div class="flex gap-2">
        <span 
          data-tooltip="Open registration form"
          role="button"
          tabindex="0"
          (click)="openRegistrationForm()"
          aria-label="Open registration form"
          class="tooltip-trigger cursor-pointer border-gray-200 bg-white p-5 dark:border-gray-800 p-2 h-10 w-10 rounded-full flex items-center justify-center">
          <i class="bi bi-box-arrow-in-right"></i>
        </span>
        <span  
        role="button"
        tabindex="0"
        aria-label="Share via email"
        (click)="openEmailShare()"
          data-tooltip="Share via email"
          class="tooltip-trigger cursor-pointer border-gray-200 bg-white p-5 dark:border-gray-800 p-2 h-10 w-10 rounded-full flex items-center justify-center">
          <i class="bi bi-envelope"></i>
        </span>
      </div>
    </div>
    <!-- Welcome section -->
    <div class="welcome-section">

      <!-- Welcome text -->
      <div class="welcome-copy">

        <span class="dashboard-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v3m0 12v3M3 12h3m12 0h3" />
            <circle cx="12" cy="12" r="6" />
          </svg>
          {{ userData()?.role || 'Dashboard' }} Dashboard
        </span>

        <h2>
          Welcome back,
          <span>{{ userData()?.name || 'User' }}!</span>
        </h2>

        <p>
          Here's your referral link. Share it with your network
          to grow your team and business.
        </p>

      </div>
    </div>

    <!-- Referral link section -->
    <div class="referral-actions">

      <label for="referral-url">
        Your Referral Link
      </label>

      <div class="referral-control-row">

        <!-- Referral URL -->
        <div class="referral-input">

          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 13.5a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72" />
            <path d="M14 10.5a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72" />
          </svg>

          <input id="referral-url" type="text" [value]="this.userData()?.referral_code" readonly aria-label="Your referral link" />

          @if (showCopied()) {
          <span class="text-sm text-gray-500 dark:text-gray-400">Copied</span>
          }
          <svg class="cursor-pointer tooltip-trigger" data-tooltip="Copy"
 (click)="copyReferralLink()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
        </div>

      </div>

    </div>
  </div>
</section>
