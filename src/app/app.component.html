@if (alertService.alert(); as alert) {
<div 
    class="absolute top-5 z-999999 w-full max-w-md"
    [ngClass]="{
      'left-5': alertService.alert()?.placement === 'left',
      'right-0  sm:right-5 px-2': alertService.alert()?.placement === 'right'
    }"
>
  <app-alert
    [variant]="alertService.alert()?.variant ?? 'info'"
    [title]="alertService.alert()?.title ?? ''"
    [message]="alertService.alert()?.message ?? ''"
  />
</div>
}

@if (authService.isLoggingOut()) {
  <div
  class="fixed inset-0 z-[999999] flex items-center justify-center overflow-hidden
         bg-white/70 backdrop-blur-sm dark:bg-gray-950/70">

  <!-- Blurry background patches -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -left-20 -top-20 h-72 w-72 rounded-full
                bg-emerald-400/20 blur-3xl dark:bg-emerald-400/15"></div>

    <div class="absolute -right-20 top-1/4 h-80 w-80 rounded-full
                bg-cyan-400/20 blur-3xl dark:bg-cyan-400/15"></div>

    <div class="absolute -bottom-24 left-1/3 h-72 w-72 rounded-full
                bg-violet-400/15 blur-3xl dark:bg-violet-400/15"></div>
  </div>

  <!-- Loader -->
  <div class="relative z-10 flex flex-col items-center gap-3">
    <div class="h-12 w-12 animate-spin rounded-full border-4
                border-gray-300 border-t-brand-500"></div>

    <p class="text-sm font-medium text-gray-700 dark:text-gray-200">
      Signing out...
    </p>
  </div>
</div>
}
